<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Client Agreement Form | Agreement Hub</title>

<link rel="stylesheet" href="css/style.css">

</head>
<body>

<header>

<div class="logo">
Agreement Hub
</div>

<nav>

<a href="index.html">Home</a>
<a href="client-form.html">Agreement Form</a>

</nav>

</header>

<section class="form-section">

<h2>Client Agreement Form</h2>

<form>

<label>Owner Name</label>
<input type="text" placeholder="Enter Owner Name">

<label>Tenant Name</label>
<input type="text" placeholder="Enter Tenant Name">

<label>Mobile Number</label>
<input type="tel" placeholder="Enter Mobile Number">

<label>Property Address</label>
<textarea placeholder="Property Address"></textarea>

<label>Monthly Rent</label>
<input type="number" placeholder="Rent">

<label>Security Deposit</label>
<input type="number" placeholder="Deposit">

<label>Agreement Start Date</label>
<input type="date">

<label>Agreement Duration</label>

<select>

<option>11 Months</option>

<option>22 Months</option>

<option>36 Months</option>

</select>

<br><br>

<button class="btn">

Submit Agreement

</button>

</form>

</section>

</body>
</html>
